[project]
name = "sistema-vendas-estoque"
version = "2.0.0"
description = "Sistema web de vendas e estoque (Flask + SQLite)"
requires-python = ">=3.10"
dependencies = ["flask>=3.0,<4", "waitress>=3.0,<4"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["dados"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B904"]

[tool.ruff.lint.per-file-ignores]
"automacao/*" = ["E402"]
"tests/*" = ["E741"]

[tool.coverage.run]
source = ["sistema"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
