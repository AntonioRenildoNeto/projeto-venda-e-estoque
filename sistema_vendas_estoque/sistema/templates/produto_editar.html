{% extends "base.html" %}
{% block titulo %}Editar produto{% endblock %}
{% block conteudo %}
<h1>Editar produto #{{ produto.id }}</h1>
<section class="cartao">
  <form method="post" action="{{ url_for('produtos.editar', produto_id=produto.id) }}" id="form-editar-produto" class="grade">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div><label for="nome">Nome</label><input id="nome" name="nome" required maxlength="80" value="{{ produto.nome }}"></div>
    <div><label for="tipo">Tipo</label>
      <select id="tipo" name="tipo">{% for t in tipos %}<option value="{{ t }}"{% if t == produto.tipo %} selected{% endif %}>{{ t }}</option>{% endfor %}</select></div>
    <div><label for="preco">Preço (R$)</label><input id="preco" name="preco" inputmode="decimal" required value="{{ ('%.2f' % produto.preco|float).replace('.', ',') if produto.preco is number else produto.preco }}"></div>
    <div><label for="estoque_minimo">Estoque mínimo</label><input id="estoque_minimo" name="estoque_minimo" type="number" min="0" step="1" value="{{ produto.estoque_minimo }}"></div>
    <div class="acao">
      <button type="submit" id="btn-salvar-produto" class="btn">Salvar</button>
      <a href="{{ url_for('produtos.listar') }}" class="btn secundario-azul">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}
