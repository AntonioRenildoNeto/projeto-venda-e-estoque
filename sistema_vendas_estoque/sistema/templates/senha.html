{% extends "base.html" %}
{% block titulo %}Alterar senha{% endblock %}
{% block conteudo %}
<h1>Alterar senha</h1>
<section class="cartao estreito">
  {% if usuario_logado.trocar_senha %}<p class="sub">Esta é a senha inicial do sistema. Escolha uma nova para continuar.</p>{% endif %}
  <form method="post" action="{{ url_for('conta.senha') }}" id="form-senha">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="senha_atual">Senha atual</label>
    <input type="password" id="senha_atual" name="senha_atual" autocomplete="current-password" required>
    <label for="senha_nova">Nova senha (mínimo 8 caracteres)</label>
    <input type="password" id="senha_nova" name="senha_nova" autocomplete="new-password" minlength="8" required>
    <label for="senha_confirmacao">Repita a nova senha</label>
    <input type="password" id="senha_confirmacao" name="senha_confirmacao" autocomplete="new-password" minlength="8" required>
    <button type="submit" id="btn-salvar-senha" class="btn">Salvar nova senha</button>
  </form>
</section>
{% endblock %}
